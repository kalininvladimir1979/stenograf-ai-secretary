# Replace example.com with your domain and issue TLS certificates before production use.
upstream secretary_api { server 127.0.0.1:3002; }
server {
  listen 80;
  server_name app.example.com admin.example.com dev.example.com;
  root /opt/ai-meeting-secretary/apps/web/dist;
  location /api/ { proxy_pass http://secretary_api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location / { try_files $uri $uri/ /index.html; }
}
