services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3002
      SECRETARY_DEPLOYED: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PUBLICATION_SECRET_KEY: ${PUBLICATION_SECRET_KEY:?PUBLICATION_SECRET_KEY is required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://app.neurozavod.online/ai-sekretar261026/api}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.neurozavod.online/ai-sekretar261026/}
    volumes:
      - app_storage:/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_BASE_PATH: /ai-sekretar261026/
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:18026:80"

volumes:
  postgres_data:
  app_storage:
